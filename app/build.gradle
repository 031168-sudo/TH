plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.minews1'
    compileSdk 35

    // Одна и та же подпись на все сборки. Android разрешает поставить сборку
    // поверх установленной, только если подпись совпадает; со случайным ключом,
    // который сборочная машина заводит заново каждый раз, обновление невозможно,
    // и приходится сносить приложение вместе с накопленной историей.
    //
    // Ключ лежит в репозитории, а репозиторий публичный: пароль ниже стережёт
    // формат хранилища, но не сам ключ. Это осознанный размен на то, чтобы
    // обновления ставились в одно нажатие.
    signingConfigs {
        shared {
            storeFile file('signing.jks')
            storePassword 'JkzPNT1R686VBiVWqYhaqE5xmABhZ2ta'
            keyAlias 'thble'
            keyPassword 'JkzPNT1R686VBiVWqYhaqE5xmABhZ2ta'
        }
    }

    defaultConfig {
        applicationId 'com.minews1.sensor'
        minSdk 23
        targetSdk 35
        // Номер сборки приходит из CI, чтобы каждая следующая была новее предыдущей.
        versionCode (System.getenv('APP_BUILD_NUMBER') ?: '1').toInteger()
        versionName '1.' + (System.getenv('APP_BUILD_NUMBER') ?: '0')
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release { signingConfig signingConfigs.shared }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
